<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <title>Alarms</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #1e1e1e; color: #eee; }
    h1 { font-weight: 500; }
    #status { margin-bottom: 16px; }
    .alarm { padding: 16px 12px; margin: 16px 0; border-radius: 10px; border: 1px solid; }
    .p1 { border-color: #e6c200; }
    .p2 { border-color: #e67e00; }
    .p3 { border-color: #e60000; }
    .meta { opacity: 0.7; }
  </style>
</head>
<body>
  <h1>Alarms</h1>
  <div id="status">Connecting...</div>
  <div id="alarms"></div>
  <script>
    const HUB_URL = "http://192.168.0.102:8080/hubs/alarms";
    const statusEl = document.getElementById("status");
    const alarmsEl = document.getElementById("alarms");
    const connection = new signalR.HubConnectionBuilder()
      .withUrl(HUB_URL)
      .withAutomaticReconnect()
      .build();
    connection.on("ReceiveAlarm", (alarm) => {
        const div = document.createElement("div");
        div.className = "alarm p" + alarm.alarmPriority;
        div.innerHTML =
            `<strong>Sensor ${alarm.sensorId}</strong>, ${alarm.temperature.toFixed(2)} °C, proirity ${alarm.alarmPriority}` +
            `<div class="meta">${alarm.timestampUtc}</div>`;
        alarmsEl.prepend(div);

        while (alarmsEl.children.length > 100) {
            alarmsEl.removeChild(alarmsEl.lastChild);
        }
    });
    connection.onreconnecting(() => { statusEl.textContent = "Ponovno povezivanje..."; });
    connection.onreconnected(() => { statusEl.textContent = "Povezan."; });
    connection.onclose(() => { statusEl.textContent = "Veza prekinuta."; });
    connection.start()
      .then(() => { statusEl.textContent = "Connected to notification service established, waiting for alarms..."; })
      .catch(err => { statusEl.textContent = "Error occured while establishing connection: " + err; });
  </script>
</body>
</html>
