services:
  postgres:
    image: postgres:16
    container_name: sensors-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sensors
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestion-service:
    build:
      context: .
      dockerfile: IngestionService/Dockerfile
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=sensors;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  consensus-service:
    build:
      context: .
      dockerfile: ConsensusService/Dockerfile
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=sensors;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  sensor-simulator:
    build:
      context: .
      dockerfile: SensorSimulator/Dockerfile
    stdin_open: true
    tty: true
    environment:
      - SensorId=1
      - ServerUrl=http://ingestion-service:8080
    depends_on:
      - ingestion-service

volumes:
  postgres_data: