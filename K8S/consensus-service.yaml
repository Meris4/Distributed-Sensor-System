apiVersion: apps/v1
kind: Deployment
metadata:
  name: consensus-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consensus-service
  template:
    metadata:
      labels:
        app: consensus-service
    spec:
      containers:
        - name: consensus-service
          image: consensus-service:latest
          imagePullPolicy: Never
          env:
            - name: ConnectionStrings__Default
              value: "Host=postgres;Port=5432;Database=sensors;Username=postgres;Password=postgres"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: consensus-service
spec:
  selector:
    app: consensus-service
  ports:
    - port: 8080
      targetPort: 8080