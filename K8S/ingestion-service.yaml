apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: ingestion-service:latest
          imagePullPolicy: Never
          env:
            - name: ConnectionStrings__Default
              value: "Host=postgres;Port=5432;Database=sensors;Username=postgres;Password=postgres"
            - name: NotificationServiceUrl
              value: "http://notification-service:8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
spec:
  selector:
    app: ingestion-service
  ports:
    - port: 8080
      targetPort: 8080